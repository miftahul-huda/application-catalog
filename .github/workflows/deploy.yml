name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast2

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Deploy to Cloud Run'
        run: |
          cd backend
          gcloud run deploy application-catalog-api \
            --source . \
            --env-vars-file env.yaml \
            --region $REGION \
            --allow-unauthenticated

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Get Backend URL'
        id: get-url
        run: |
          URL=$(gcloud run services describe application-catalog-api --region $REGION --format 'value(status.url)')
          echo "backend_url=$URL" >> $GITHUB_OUTPUT

      - name: 'Deploy to Cloud Run'
        run: |
          cd frontend
          gcloud run deploy application-catalog-web \
            --source . \
            --set-env-vars VITE_API_URL=${{ steps.get-url.outputs.backend_url }}/api \
            --region $REGION \
            --allow-unauthenticated
